<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PosterStudio - Pro Edition</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Fabric.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Oswald:wght@400;700&family=Lobster&family=Poppins:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        /* Hide scrollbar for a native app feel */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="bg-gray-50 font-sans h-screen flex flex-col overflow-hidden text-slate-800 relative">

    <!-- ========================================== -->
    <!-- 1. FULLSCREEN LOGIN SCREEN -->
    <!-- ========================================== -->
    <div id="loginScreen" class="absolute inset-0 bg-slate-900 z-50 flex items-center justify-center">
        <div class="bg-white rounded-2xl p-10 w-full max-w-md text-center shadow-2xl transition-all duration-300">
            <div class="w-20 h-20 mx-auto bg-blue-600 text-white rounded-2xl flex items-center justify-center text-3xl font-bold mb-6 shadow-lg">
                <i class="fa-solid fa-wand-magic-sparkles"></i>
            </div>
            <h1 class="text-3xl font-bold text-gray-800 mb-2">PosterStudio</h1>
            <p class="text-gray-500 mb-8">Sign in to access your workspace</p>

            <button id="googleLoginBtn" onclick="window.loginWithGoogle()" class="w-full flex items-center justify-center gap-3 bg-white border-2 border-gray-200 text-gray-700 font-bold py-3.5 px-4 rounded-xl hover:bg-gray-50 hover:border-blue-500 transition-all shadow-sm">
                <svg class="w-6 h-6" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path fill="#4285F4" d="M21.35 12.27c0-.73-.06-1.43-.18-2.09H12v3.95h5.24a4.48 4.48 0 0 1-1.94 2.94v2.45h3.14c1.84-1.69 2.91-4.18 2.91-7.25z"/>
                    <path fill="#34A853" d="M12 21.82c2.63 0 4.84-.87 6.45-2.35l-3.14-2.45c-.87.58-1.98.92-3.31.92-2.54 0-4.69-1.72-5.46-4.03H3.3v2.53A9.75 9.75 0 0 0 12 21.82z"/>
                    <path fill="#FBBC05" d="M6.54 13.91A5.86 5.86 0 0 1 6.23 12c0-.66.11-1.3.31-1.91V7.56H3.3A9.75 9.75 0 0 0 2.25 12c0 1.57.38 3.05 1.05 4.44l3.24-2.53z"/>
                    <path fill="#EA4335" d="M12 6.06c1.43 0 2.71.49 3.72 1.45l2.79-2.79C16.84 3.14 14.63 2.18 12 2.18a9.75 9.75 0 0 0-8.7 5.38l3.24 2.53C7.31 7.78 9.46 6.06 12 6.06z"/>
                </svg>
                Continue with Google
            </button>
            <p id="authStatus" class="mt-4 text-sm font-semibold hidden"></p>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- 2. MAIN APP CONTAINER -->
    <!-- ========================================== -->
    <div id="mainApp" class="hidden flex-col h-screen w-full">
        
        <!-- HEADER (Shared) -->
        <header class="bg-gray-900 text-white px-6 py-3 flex justify-between items-center z-20 shadow-lg border-b border-gray-800">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-wand-magic-sparkles text-blue-400 text-xl"></i>
                <h1 class="text-xl font-bold tracking-wide">PosterStudio</h1>
            </div>
            
            <div class="flex items-center gap-4">
                <div class="flex gap-2 bg-gray-800 p-1 rounded-lg">
                    <button onclick="window.switchMainTab('admin')" id="btnAdmin" class="hidden bg-transparent hover:bg-gray-700 text-gray-300 px-4 py-1.5 rounded text-sm font-semibold transition-all items-center gap-2">
                        <i class="fa-solid fa-pen-ruler"></i> Editor Mode
                    </button>
                    <button onclick="window.switchMainTab('app')" id="btnApp" class="bg-blue-600 text-white px-4 py-1.5 rounded shadow-sm text-sm font-semibold transition-all flex items-center gap-2">
                        <i class="fa-solid fa-mobile-screen"></i> App Mode
                    </button>
                </div>
            </div>
        </header>

        <!-- ========================================== -->
        <!-- 3. ADMIN PANEL (Hidden by Default) -->
        <!-- ========================================== -->
        <div id="adminPanel" class="flex-1 hidden overflow-hidden">
            <!-- Sidebar -->
            <aside class="w-80 bg-white shadow-xl flex flex-col h-full z-10 border-r border-gray-200">
                <div class="p-5 flex-1 overflow-y-auto space-y-6">
                    <div class="bg-gray-50 p-4 rounded-xl border border-gray-100">
                        <label class="font-bold text-gray-700 text-sm mb-3 flex items-center gap-2"><i class="fa-regular fa-image text-blue-500"></i> 1. Background</label>
                        <label id="bgUploadLabel" class="cursor-pointer bg-white border border-gray-300 hover:border-blue-500 text-gray-700 text-sm text-center py-2 px-4 rounded block shadow-sm relative overflow-hidden">
                            <span id="bgUploadText"><i class="fa-solid fa-upload mr-1"></i> Upload Image</span>
                            <input type="file" id="bgUpload" accept="image/*" class="hidden">
                        </label>
                    </div>
                    <div>
                        <label class="font-bold text-gray-700 text-sm mb-3 flex items-center gap-2"><i class="fa-solid fa-layer-group text-blue-500"></i> 2. Add Elements</label>
                        <div class="grid grid-cols-2 gap-3">
                            <button onclick="window.addText('{{USER_NAME}}')" class="bg-white border border-gray-200 p-3 text-xs font-semibold rounded-lg hover:border-blue-500 flex flex-col items-center gap-1"><i class="fa-solid fa-user text-lg"></i> User Name</button>
                            <button onclick="window.addText('{{BIZ_NAME}}')" class="bg-white border border-gray-200 p-3 text-xs font-semibold rounded-lg hover:border-blue-500 flex flex-col items-center gap-1"><i class="fa-solid fa-shop text-lg"></i> Biz Name</button>
                            <button onclick="window.addBox('PHOTO')" class="bg-blue-50 border border-blue-200 p-3 text-xs font-semibold rounded-lg text-blue-700 hover:bg-blue-100 flex flex-col items-center gap-1"><i class="fa-solid fa-camera-retro text-lg"></i> Photo Box</button>
                            <button onclick="window.addBox('LOGO')" class="bg-amber-50 border border-amber-200 p-3 text-xs font-semibold rounded-lg text-amber-700 hover:bg-amber-100 flex flex-col items-center gap-1"><i class="fa-solid fa-circle-check text-lg"></i> Logo Box</button>
                        </div>
                    </div>
                    <div id="stylePanel" class="opacity-50 pointer-events-none transition-opacity">
                        <label class="font-bold text-gray-700 text-sm mb-3 flex items-center gap-2"><i class="fa-solid fa-palette text-blue-500"></i> 3. Style Object</label>
                        <div class="bg-white p-4 rounded-xl border border-gray-200 shadow-sm space-y-3">
                            <div class="flex gap-2">
                                <select id="fontFamily" class="w-2/3 border border-gray-300 rounded-md px-2 py-1.5 text-sm outline-none"><option value="sans-serif">Default</option><option value="Roboto">Roboto</option><option value="Poppins">Poppins</option><option value="Oswald">Oswald</option></select>
                                <input type="number" id="fontSize" placeholder="Size" class="w-1/3 border border-gray-300 rounded-md px-2 py-1.5 text-sm outline-none">
                            </div>
                            <div class="flex items-center gap-2">
                                <input type="color" id="colorPicker" class="w-10 h-8 rounded border cursor-pointer">
                                <div class="flex-1 flex bg-gray-100 rounded-md p-1">
                                    <button onclick="window.setTextAlign('left')" class="flex-1 text-gray-600 hover:bg-white rounded py-1 text-sm"><i class="fa-solid fa-align-left"></i></button>
                                    <button onclick="window.setTextAlign('center')" class="flex-1 text-gray-600 hover:bg-white rounded py-1 text-sm"><i class="fa-solid fa-align-center"></i></button>
                                    <button onclick="window.setTextAlign('right')" class="flex-1 text-gray-600 hover:bg-white rounded py-1 text-sm"><i class="fa-solid fa-align-right"></i></button>
                                </div>
                            </div>
                            <button onclick="window.deleteObject()" class="w-full bg-red-50 text-red-600 border border-red-200 py-2 text-sm font-semibold rounded mt-2 flex justify-center items-center gap-2"><i class="fa-solid fa-trash-can"></i> Delete</button>
                        </div>
                    </div>
                </div>
                <div class="p-5 bg-white border-t border-gray-200"><button onclick="window.saveTemplate()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg shadow-md flex justify-center items-center gap-2"><i class="fa-solid fa-floppy-disk"></i> Save Template</button></div>
            </aside>
            <main class="flex-1 bg-slate-200 flex items-center justify-center relative overflow-auto p-8">
                <div class="bg-white shadow-2xl relative border" style="width: 800px; height: 800px; background-image: linear-gradient(45deg, #f0f0f0 25%, transparent 25%), linear-gradient(-45deg, #f0f0f0 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #f0f0f0 75%), linear-gradient(-45deg, transparent 75%, #f0f0f0 75%); background-size: 20px 20px;">
                    <canvas id="adminCanvas"></canvas>
                </div>
            </main>
        </div>

        <!-- ========================================== -->
        <!-- 4. CLIENT APP VIEW (With Bottom Bar) -->
        <!-- ========================================== -->
        <div id="clientApp" class="flex-1 flex flex-col relative bg-slate-100 overflow-hidden">
            
            <!-- App Content Area (Scrollable) -->
            <main class="flex-1 overflow-y-auto pb-20">
                
                <!-- TAB 1: POSTERS PAGE -->
                <div id="appTabPosters" class="p-4 max-w-5xl mx-auto w-full">
                    <div class="flex justify-between items-center mb-6 mt-2">
                        <div>
                            <h2 class="text-2xl font-bold text-gray-800">Your Posters</h2>
                            <p class="text-sm text-gray-500">Ready to download & share</p>
                        </div>
                        <!-- Filters -->
                        <div class="flex bg-gray-200 p-1 rounded-lg">
                            <button onclick="window.setFilter('Today')" id="filterToday" class="bg-white shadow-sm text-blue-600 px-4 py-1.5 rounded-md text-sm font-bold transition-all">Today</button>
                            <button onclick="window.setFilter('All')" id="filterAll" class="text-gray-500 hover:text-gray-700 px-4 py-1.5 rounded-md text-sm font-bold transition-all">All</button>
                        </div>
                    </div>
                    
                    <!-- Posters Grid -->
                    <div id="postersGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                        <!-- Posters will be injected here via JS -->
                        <div class="col-span-full text-center text-gray-500 py-10">
                            <i class="fa-solid fa-spinner fa-spin text-2xl mb-2"></i><br>Loading Posters...
                        </div>
                    </div>
                </div>

                <!-- TAB 2: PAYMENTS PAGE -->
                <div id="appTabPayments" class="hidden p-4 h-full flex items-center justify-center">
                    <div class="text-center bg-white p-8 rounded-2xl shadow-sm border border-gray-100 w-full max-w-md">
                        <div class="w-16 h-16 bg-emerald-100 text-emerald-500 rounded-full flex items-center justify-center text-2xl mx-auto mb-4">
                            <i class="fa-solid fa-wallet"></i>
                        </div>
                        <h2 class="text-xl font-bold text-gray-800 mb-2">Payments & Subscription</h2>
                        <p class="text-gray-500 mb-6 text-sm">Your active plans and payment history will appear here.</p>
                        <button class="bg-gray-100 text-gray-700 font-bold py-2 px-6 rounded-lg cursor-not-allowed">Coming Soon</button>
                    </div>
                </div>

                <!-- TAB 3: PROFILE PAGE -->
                <div id="appTabProfile" class="hidden p-4 max-w-lg mx-auto w-full">
                    <div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-100 mt-2">
                        <div class="flex justify-between items-center mb-6">
                            <h2 class="text-xl font-bold text-gray-800">Business Profile</h2>
                            <button onclick="window.logoutUser()" class="text-red-500 bg-red-50 px-3 py-1 rounded text-xs font-bold"><i class="fa-solid fa-arrow-right-from-bracket"></i> Logout</button>
                        </div>
                        
                        <form id="profileForm" onsubmit="event.preventDefault(); window.submitProfile();" class="space-y-4">
                            <div>
                                <label class="block text-xs font-bold text-gray-500 mb-1">Your Full Name</label>
                                <input type="text" id="profName" required class="w-full border border-gray-300 rounded-lg px-4 py-2.5 outline-none focus:border-blue-500 font-semibold">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-gray-500 mb-1">Business/Shop Name</label>
                                <input type="text" id="profBizName" required class="w-full border border-gray-300 rounded-lg px-4 py-2.5 outline-none focus:border-blue-500 font-semibold">
                            </div>
                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-xs font-bold text-gray-500 mb-1">WhatsApp No.</label>
                                    <input type="tel" id="profWhatsapp" required class="w-full border border-gray-300 rounded-lg px-4 py-2.5 outline-none focus:border-blue-500 font-semibold">
                                </div>
                                <div>
                                    <label class="block text-xs font-bold text-gray-500 mb-1">City/Address</label>
                                    <input type="text" id="profAddress" required class="w-full border border-gray-300 rounded-lg px-4 py-2.5 outline-none focus:border-blue-500 font-semibold">
                                </div>
                            </div>
                            <div class="grid grid-cols-2 gap-4 mt-2">
                                <div class="bg-blue-50 p-3 rounded-lg border border-blue-100">
                                    <label class="block text-xs font-bold text-blue-800 mb-1">Update Photo</label>
                                    <input type="file" id="profPhoto" accept="image/*" class="text-xs w-full text-blue-600">
                                    <p class="text-[10px] text-blue-500 mt-1">Leave empty to keep current</p>
                                </div>
                                <div class="bg-amber-50 p-3 rounded-lg border border-amber-100">
                                    <label class="block text-xs font-bold text-amber-800 mb-1">Update Logo</label>
                                    <input type="file" id="profLogo" accept="image/*" class="text-xs w-full text-amber-600">
                                    <p class="text-[10px] text-amber-500 mt-1">Leave empty to keep current</p>
                                </div>
                            </div>
                            
                            <button type="submit" id="profSubmitBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg mt-6 shadow-md transition-all flex items-center justify-center gap-2">
                                <i class="fa-solid fa-floppy-disk"></i> Save Details
                            </button>
                        </form>
                    </div>
                </div>

            </main>

            <!-- Bottom Navigation Bar -->
            <nav class="absolute bottom-0 w-full bg-white border-t border-gray-200 flex justify-around items-center h-16 px-2 pb-safe z-50 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]">
                <button onclick="window.switchBottomTab('posters')" id="navPosters" class="flex flex-col items-center justify-center w-full h-full text-blue-600 transition-colors">
                    <i class="fa-solid fa-images text-xl mb-1"></i>
                    <span class="text-[10px] font-bold">Posters</span>
                </button>
                <button onclick="window.switchBottomTab('payments')" id="navPayments" class="flex flex-col items-center justify-center w-full h-full text-gray-400 hover:text-gray-600 transition-colors">
                    <i class="fa-solid fa-wallet text-xl mb-1"></i>
                    <span class="text-[10px] font-bold">Payments</span>
                </button>
                <button onclick="window.switchBottomTab('profile')" id="navProfile" class="flex flex-col items-center justify-center w-full h-full text-gray-400 hover:text-gray-600 transition-colors relative">
                    <i class="fa-solid fa-user-gear text-xl mb-1"></i>
                    <span class="text-[10px] font-bold">Profile</span>
                    <!-- Notification dot for incomplete profile -->
                    <span id="profileAlertDot" class="hidden absolute top-2 right-8 w-2.5 h-2.5 bg-red-500 rounded-full border-2 border-white"></span>
                </button>
            </nav>
        </div>
    </div>

    <!-- Hidden canvas for generating poster images in the background -->
    <canvas id="offscreenCanvas" style="display:none;"></canvas>

    <!-- ========================================== -->
    <!-- JAVASCRIPT LOGIC -->
    <!-- ========================================== -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, getDocs, collection } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAkBV0VxVU3Mn0paHqxU0Dgm-TuNRS6hEg",
            authDomain: "posterplus-84021.firebaseapp.com",
            projectId: "posterplus-84021",
            storageBucket: "posterplus-84021.firebasestorage.app",
            messagingSenderId: "556835154127",
            appId: "1:556835154127:web:a5c921e21d83ad8e1cafba",
            measurementId: "G-KJ3C5YVQ0S"
        };
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();
        const db = getFirestore(app);

        // 🔴 API KEY FOR IMGBB
        const IMGBB_API_KEY = "YOUR_IMGBB_API_KEY_HERE"; 

        let adminCanvas;
        let offscreenFabricCanvas;
        let isAdminLoggedIn = false;
        let currentClientData = null; 

        const allowedAdminEmails = ["jkhdpix@gmail.com"];

        adminCanvas = new fabric.Canvas('adminCanvas', { width: 800, height: 800, preserveObjectStacking: true });
        offscreenFabricCanvas = new fabric.StaticCanvas('offscreenCanvas', { width: 800, height: 800 });

        // --- AUTHENTICATION & ROUTING ---
        onAuthStateChanged(auth, async (user) => {
            const loginScreen = document.getElementById('loginScreen');
            const mainApp = document.getElementById('mainApp');
            const btnAdmin = document.getElementById('btnAdmin');
            
            if (user) {
                // If ADMIN
                if (allowedAdminEmails.includes(user.email)) {
                    isAdminLoggedIn = true;
                    btnAdmin.classList.replace('hidden', 'flex'); 
                } else {
                    isAdminLoggedIn = false;
                    btnAdmin.classList.replace('flex', 'hidden');
                }

                loginScreen.classList.add('hidden');
                mainApp.classList.replace('hidden', 'flex');

                // Check Client Profile
                const docSnap = await getDoc(doc(db, "clients", user.uid));
                if (docSnap.exists()) {
                    currentClientData = docSnap.data();
                    populateProfileForm();
                    window.switchMainTab('app'); // Go to App Mode
                    window.switchBottomTab('posters');
                    document.getElementById('profileAlertDot').classList.add('hidden');
                } else {
                    // Force user to Profile Tab to complete registration
                    currentClientData = null;
                    window.switchMainTab('app');
                    window.switchBottomTab('profile');
                    document.getElementById('profileAlertDot').classList.remove('hidden');
                    alert("Welcome! Please complete your Business Profile first to see your posters.");
                }
            } else {
                isAdminLoggedIn = false;
                currentClientData = null;
                loginScreen.classList.remove('hidden');
                mainApp.classList.replace('flex', 'hidden');
            }
        });

        window.loginWithGoogle = async () => {
            document.getElementById("authStatus").className = "mt-4 text-sm font-semibold text-blue-600 block";
            document.getElementById("authStatus").innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-1"></i> Connecting...';
            try { await signInWithPopup(auth, provider); } catch (e) {
                document.getElementById("authStatus").className = "mt-4 text-sm font-bold text-red-700 block";
                document.getElementById("authStatus").innerText = 'Login failed.';
            }
        };

        window.logoutUser = async () => {
            await signOut(auth);
        };

        // --- NAVIGATION TABS ---
        window.switchMainTab = (mode) => {
            const adminPnl = document.getElementById('adminPanel');
            const clientApp = document.getElementById('clientApp');
            const btnAdmin = document.getElementById('btnAdmin');
            const btnApp = document.getElementById('btnApp');

            if (mode === 'admin' && isAdminLoggedIn) {
                adminPnl.classList.replace('hidden', 'flex');
                clientApp.classList.replace('flex', 'hidden');
                btnAdmin.classList.replace('bg-transparent', 'bg-blue-600');
                btnAdmin.classList.replace('text-gray-300', 'text-white');
                btnApp.classList.replace('bg-blue-600', 'bg-transparent');
                btnApp.classList.replace('text-white', 'text-gray-300');
            } else {
                adminPnl.classList.replace('flex', 'hidden');
                clientApp.classList.replace('hidden', 'flex');
                btnApp.classList.replace('bg-transparent', 'bg-blue-600');
                btnApp.classList.replace('text-gray-300', 'text-white');
                if(isAdminLoggedIn) {
                    btnAdmin.classList.replace('bg-blue-600', 'bg-transparent');
                    btnAdmin.classList.replace('text-white', 'text-gray-300');
                }
                
                // If in app mode and profile exists, load posters
                if(currentClientData) loadPostersFeed();
            }
        };

        window.switchBottomTab = (tab) => {
            // Hide all
            document.getElementById('appTabPosters').classList.add('hidden');
            document.getElementById('appTabPayments').classList.add('hidden');
            document.getElementById('appTabProfile').classList.add('hidden');
            
            // Reset Nav Icons
            document.getElementById('navPosters').className = "flex flex-col items-center justify-center w-full h-full text-gray-400 hover:text-gray-600 transition-colors";
            document.getElementById('navPayments').className = "flex flex-col items-center justify-center w-full h-full text-gray-400 hover:text-gray-600 transition-colors";
            document.getElementById('navProfile').className = "flex flex-col items-center justify-center w-full h-full text-gray-400 hover:text-gray-600 transition-colors relative";

            // Show Selected
            if(tab === 'posters') {
                if(!currentClientData) { alert("Please complete your profile first."); window.switchBottomTab('profile'); return; }
                document.getElementById('appTabPosters').classList.remove('hidden');
                document.getElementById('navPosters').classList.replace('text-gray-400', 'text-blue-600');
                loadPostersFeed();
            } 
            else if(tab === 'payments') {
                if(!currentClientData) { alert("Please complete your profile first."); window.switchBottomTab('profile'); return; }
                document.getElementById('appTabPayments').classList.remove('hidden');
                document.getElementById('navPayments').classList.replace('text-gray-400', 'text-blue-600');
            } 
            else if(tab === 'profile') {
                document.getElementById('appTabProfile').classList.remove('hidden');
                document.getElementById('navProfile').classList.replace('text-gray-400', 'text-blue-600');
            }
        };

        // --- PROFILE LOGIC (SAVE & UPDATE) ---
        function populateProfileForm() {
            if(!currentClientData) return;
            document.getElementById('profName').value = currentClientData.name || '';
            document.getElementById('profBizName').value = currentClientData.bizName || '';
            document.getElementById('profWhatsapp').value = currentClientData.whatsapp || '';
            document.getElementById('profAddress').value = currentClientData.address || '';
            // Required only if new
            document.getElementById('profPhoto').required = false; 
            document.getElementById('profLogo').required = false;
        }

        const uploadToImgBB = async (file) => {
            const formData = new FormData();
            formData.append('image', file);
            formData.append('key', IMGBB_API_KEY);
            const res = await fetch('https://api.imgbb.com/1/upload', { method: 'POST', body: formData });
            const data = await res.json();
            if(data.success) return data.data.url;
            throw new Error("Upload Failed");
        };

        window.submitProfile = async () => {
            if(IMGBB_API_KEY === "YOUR_IMGBB_API_KEY_HERE") { alert("Missing ImgBB API Key"); return; }
            const btn = document.getElementById('profSubmitBtn');
            const originalHTML = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Saving...';
            
            try {
                let photoUrl = currentClientData ? currentClientData.photo : null;
                let logoUrl = currentClientData ? currentClientData.logo : null;

                const photoFile = document.getElementById('profPhoto').files[0];
                const logoFile = document.getElementById('profLogo').files[0];
                
                if (photoFile) photoUrl = await uploadToImgBB(photoFile);
                if (logoFile) logoUrl = await uploadToImgBB(logoFile);

                if(!photoUrl || !logoUrl) { throw new Error("Images are required for new profile."); }

                const profileData = {
                    email: auth.currentUser.email,
                    name: document.getElementById('profName').value,
                    bizName: document.getElementById('profBizName').value,
                    whatsapp: document.getElementById('profWhatsapp').value,
                    address: document.getElementById('profAddress').value,
                    photo: photoUrl,
                    logo: logoUrl,
                    updatedAt: new Date().toISOString()
                };

                await setDoc(doc(db, "clients", auth.currentUser.uid), profileData, { merge: true });
                
                currentClientData = profileData;
                document.getElementById('profileAlertDot').classList.add('hidden');
                
                btn.innerHTML = '<i class="fa-solid fa-check"></i> Saved!';
                btn.classList.replace('bg-blue-600', 'bg-green-600');
                setTimeout(() => { 
                    btn.innerHTML = originalHTML; 
                    btn.classList.replace('bg-green-600', 'bg-blue-600'); 
                    btn.disabled = false;
                    window.switchBottomTab('posters');
                }, 1500);

            } catch(e) {
                alert("Error saving profile: " + e.message);
                btn.innerHTML = originalHTML;
                btn.disabled = false;
            }
        };

        // --- FEED / POSTERS RENDER LOGIC ---
        let currentFilter = 'Today';
        window.setFilter = (filterType) => {
            currentFilter = filterType;
            if(filterType === 'Today') {
                document.getElementById('filterToday').className = "bg-white shadow-sm text-blue-600 px-4 py-1.5 rounded-md text-sm font-bold transition-all";
                document.getElementById('filterAll').className = "text-gray-500 hover:text-gray-700 px-4 py-1.5 rounded-md text-sm font-bold transition-all";
            } else {
                document.getElementById('filterAll').className = "bg-white shadow-sm text-blue-600 px-4 py-1.5 rounded-md text-sm font-bold transition-all";
                document.getElementById('filterToday').className = "text-gray-500 hover:text-gray-700 px-4 py-1.5 rounded-md text-sm font-bold transition-all";
            }
            loadPostersFeed();
        };

        window.downloadPosterImage = (dataUrl) => {
            const link = document.createElement('a'); 
            link.download = `Poster_${Date.now()}.png`; 
            link.href = dataUrl; 
            link.click();
        };

        async function loadPostersFeed() {
            if(!currentClientData) return;
            const grid = document.getElementById('postersGrid');
            grid.innerHTML = '<div class="col-span-full text-center text-gray-500 py-10"><i class="fa-solid fa-spinner fa-spin text-2xl mb-2"></i><br>Generating Posters...</div>';

            try {
                // Fetching templates (You can loop if you have multiple docs, here we fetch main_poster)
                const docSnap = await getDoc(doc(db, "templates", "main_poster"));
                if (!docSnap.exists()) {
                    grid.innerHTML = '<div class="col-span-full text-center text-gray-500 py-10">No templates found. Admin needs to create one!</div>';
                    return;
                }
                
                const templateJSON = docSnap.data().templateData;
                
                // Process JSON in offscreen canvas
                offscreenFabricCanvas.loadFromJSON(templateJSON, () => {
                    const objects = offscreenFabricCanvas.getObjects();
                    
                    // We need a promise array for images
                    let promises = [];

                    objects.forEach((obj) => {
                        if (obj.type === 'i-text' || obj.type === 'text') {
                            if (obj.text.includes('{{USER_NAME}}')) obj.set('text', obj.text.replace('{{USER_NAME}}', currentClientData.name));
                            if (obj.text.includes('{{BIZ_NAME}}')) obj.set('text', obj.text.replace('{{BIZ_NAME}}', currentClientData.bizName));
                            obj.initDimensions(); obj.setCoords();
                        }
                        
                        if (obj.placeholderType === 'PHOTO' || obj.placeholderType === 'LOGO') {
                            const imgUrl = obj.placeholderType === 'PHOTO' ? currentClientData.photo : currentClientData.logo;
                            
                            let p = new Promise((resolve) => {
                                fabric.Image.fromURL(imgUrl, (realImg) => {
                                    const sX = (obj.width * obj.scaleX) / realImg.width;
                                    const sY = (obj.height * obj.scaleY) / realImg.height;
                                    realImg.set({ left: obj.left, top: obj.top, originX: obj.originX, originY: obj.originY, scaleX: sX, scaleY: sY, angle: obj.angle });
                                    offscreenFabricCanvas.remove(obj); 
                                    offscreenFabricCanvas.add(realImg); 
                                    realImg.moveTo(offscreenFabricCanvas.getObjects().indexOf(obj));
                                    resolve();
                                }, { crossOrigin: 'anonymous' });
                            });
                            promises.push(p);
                        }
                    });

                    // Wait for all images to load into canvas
                    Promise.all(promises).then(() => {
                        offscreenFabricCanvas.renderAll();
                        // Generate Final Image URL
                        const finalImageURL = offscreenFabricCanvas.toDataURL({ format: 'png', multiplier: 1.5 });
                        
                        // INJECT HTML
                        grid.innerHTML = `
                            <div class="bg-white p-3 rounded-2xl shadow-sm border border-gray-100 flex flex-col">
                                <img src="${finalImageURL}" class="w-full h-auto rounded-xl border border-gray-100 mb-3" />
                                <div class="mt-auto flex justify-between items-center px-1">
                                    <span class="text-sm font-bold text-gray-800 truncate">Festival Special</span>
                                    <button onclick="window.downloadPosterImage('${finalImageURL}')" class="bg-blue-50 hover:bg-blue-100 text-blue-600 px-4 py-1.5 rounded-lg text-sm font-bold transition-colors shrink-0">
                                        <i class="fa-solid fa-download mr-1"></i> Save
                                    </button>
                                </div>
                            </div>
                        `;
                        
                        // Fake second poster for UI demonstration (if 'All' is selected)
                        if(currentFilter === 'All') {
                            grid.innerHTML += `
                                <div class="bg-white p-3 rounded-2xl shadow-sm border border-gray-100 flex flex-col opacity-75">
                                    <img src="${finalImageURL}" class="w-full h-auto rounded-xl border border-gray-100 mb-3 grayscale" />
                                    <div class="mt-auto flex justify-between items-center px-1">
                                        <span class="text-sm font-bold text-gray-800 truncate">Old Template</span>
                                        <button class="bg-gray-100 text-gray-400 px-4 py-1.5 rounded-lg text-sm font-bold shrink-0 cursor-not-allowed">
                                            <i class="fa-solid fa-lock mr-1"></i> Pro
                                        </button>
                                    </div>
                                </div>
                            `;
                        }
                    });
                });
            } catch (error) {
                console.error(error);
                grid.innerHTML = '<div class="col-span-full text-center text-red-500 py-10">Error loading posters.</div>';
            }
        }

        // 👉 ADMIN EDITOR FUNCTIONS (Same as before) 👈
        document.getElementById('bgUpload').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            if(IMGBB_API_KEY === "YOUR_IMGBB_API_KEY_HERE") { alert("Missing ImgBB API Key"); return; }
            const bgUploadLabel = document.getElementById('bgUploadLabel');
            const bgUploadText = document.getElementById('bgUploadText');
            const originalHTML = bgUploadText.innerHTML;
            bgUploadText.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-1"></i> Uploading...';
            bgUploadLabel.style.pointerEvents = 'none';
            try {
                const downloadURL = await uploadToImgBB(file);
                fabric.Image.fromURL(downloadURL, (img) => {
                    const scale = Math.max(800 / img.width, 800 / img.height);
                    img.set({ scaleX: scale, scaleY: scale, originX: 'center', originY: 'center', top: 400, left: 400 });
                    adminCanvas.setBackgroundImage(img, adminCanvas.renderAll.bind(adminCanvas));
                    bgUploadText.innerHTML = '<i class="fa-solid fa-check text-green-500 mr-1"></i> Uploaded!';
                    setTimeout(() => { bgUploadText.innerHTML = originalHTML; bgUploadLabel.style.pointerEvents = 'auto'; }, 2000);
                }, { crossOrigin: 'anonymous' });
            } catch (error) {
                alert("Failed to upload background!");
                bgUploadText.innerHTML = originalHTML;
                bgUploadLabel.style.pointerEvents = 'auto';
            }
        });

        adminCanvas.on('selection:created', updateStylingPanel);
        adminCanvas.on('selection:updated', updateStylingPanel);
        adminCanvas.on('selection:cleared', () => { document.getElementById('stylePanel').classList.add('opacity-50', 'pointer-events-none'); });

        document.getElementById('colorPicker').oninput = function() { const obj = adminCanvas.getActiveObject(); if(obj) { obj.set('fill', this.value); adminCanvas.renderAll(); }};
        document.getElementById('fontSize').oninput = function() { const obj = adminCanvas.getActiveObject(); if(obj && obj.type === 'i-text') { obj.set('fontSize', parseInt(this.value)); adminCanvas.renderAll(); }};
        document.getElementById('fontFamily').onchange = function() { const obj = adminCanvas.getActiveObject(); if(obj && obj.type === 'i-text') { obj.set('fontFamily', this.value); adminCanvas.renderAll(); }};

        window.addText = (str) => {
            const text = new fabric.IText(str, { left: 400, top: 400, originX: 'center', originY: 'center', fontFamily: 'Poppins', fontSize: 50, fill: '#1e293b', fontWeight: 'bold', placeholderType: 'TEXT', shadow: new fabric.Shadow({ color: 'rgba(255,255,255,0.8)', blur: 2, offsetX: 1, offsetY: 1 }) });
            adminCanvas.add(text); adminCanvas.setActiveObject(text);
        };
        window.addBox = (type) => {
            const isPhoto = type === 'PHOTO';
            const rect = new fabric.Rect({ left: 400, top: 400, originX: 'center', originY: 'center', width: isPhoto ? 250 : 150, height: isPhoto ? 300 : 150, fill: isPhoto ? 'rgba(59, 130, 246, 0.2)' : 'rgba(245, 158, 11, 0.2)', stroke: isPhoto ? '#3b82f6' : '#f59e0b', strokeDashArray: [8,8], strokeWidth: 3, placeholderType: type });
            adminCanvas.add(rect); adminCanvas.setActiveObject(rect);
        };
        window.deleteObject = () => { const obj = adminCanvas.getActiveObject(); if(obj) { adminCanvas.remove(obj); document.getElementById('stylePanel').classList.add('opacity-50', 'pointer-events-none'); } };
        window.setTextAlign = (align) => { const obj = adminCanvas.getActiveObject(); if(obj && obj.type === 'i-text') { obj.set('textAlign', align); adminCanvas.renderAll(); } };

        function updateStylingPanel() {
            const obj = adminCanvas.getActiveObject();
            if(!obj) return;
            document.getElementById('stylePanel').classList.remove('opacity-50', 'pointer-events-none');
            document.getElementById('colorPicker').value = obj.fill || '#000000';
            if(obj.type === 'i-text') {
                document.getElementById('fontSize').value = obj.fontSize;
                document.getElementById('fontFamily').value = obj.fontFamily || 'sans-serif';
            }
        }

        window.saveTemplate = async () => {
            const saveBtn = document.querySelector('button[onclick="window.saveTemplate()"]');
            const originalHTML = saveBtn.innerHTML;
            saveBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Saving to Cloud...';
            try {
                const json = adminCanvas.toJSON(['placeholderType']);
                savedTemplateJSON = JSON.stringify(json);
                await setDoc(doc(db, "templates", "main_poster"), { templateData: savedTemplateJSON, updatedAt: new Date().toISOString() });
                saveBtn.innerHTML = '<i class="fa-solid fa-check"></i> Cloud Saved!';
                saveBtn.classList.replace('bg-blue-600', 'bg-green-600');
                setTimeout(() => { saveBtn.innerHTML = originalHTML; saveBtn.classList.replace('bg-green-600', 'bg-blue-600'); }, 2000);
            } catch (error) {
                alert("Error saving to cloud! Check Firestore rules.");
                saveBtn.innerHTML = originalHTML;
            }
        };
    </script>
</body>
</html>
