<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PosterStudio - Pro Edition</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Fabric.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Oswald:wght@400;700&family=Lobster&family=Poppins:wght@400;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-50 font-sans h-screen flex flex-col overflow-hidden text-slate-800 relative">

    <!-- ========================================== -->
    <!-- 1. FULLSCREEN LOGIN SCREEN (Visible by Default) -->
    <!-- ========================================== -->
    <div id="loginScreen" class="absolute inset-0 bg-slate-900 z-50 flex items-center justify-center">
        <div class="bg-white rounded-2xl p-10 w-full max-w-md text-center shadow-2xl transition-all duration-300">
            <div class="w-20 h-20 mx-auto bg-blue-600 text-white rounded-2xl flex items-center justify-center text-3xl font-bold mb-6 shadow-lg">
                <i class="fa-solid fa-wand-magic-sparkles"></i>
            </div>
            <h1 class="text-3xl font-bold text-gray-800 mb-2">PosterStudio</h1>
            <p class="text-gray-500 mb-8">Sign in to access your workspace</p>

            <button id="googleLoginBtn" onclick="window.loginWithGoogle()" class="w-full flex items-center justify-center gap-3 bg-white border-2 border-gray-200 text-gray-700 font-bold py-3.5 px-4 rounded-xl hover:bg-gray-50 hover:border-blue-500 transition-all shadow-sm">
                <svg class="w-6 h-6" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path fill="#4285F4" d="M21.35 12.27c0-.73-.06-1.43-.18-2.09H12v3.95h5.24a4.48 4.48 0 0 1-1.94 2.94v2.45h3.14c1.84-1.69 2.91-4.18 2.91-7.25z"/>
                    <path fill="#34A853" d="M12 21.82c2.63 0 4.84-.87 6.45-2.35l-3.14-2.45c-.87.58-1.98.92-3.31.92-2.54 0-4.69-1.72-5.46-4.03H3.3v2.53A9.75 9.75 0 0 0 12 21.82z"/>
                    <path fill="#FBBC05" d="M6.54 13.91A5.86 5.86 0 0 1 6.23 12c0-.66.11-1.3.31-1.91V7.56H3.3A9.75 9.75 0 0 0 2.25 12c0 1.57.38 3.05 1.05 4.44l3.24-2.53z"/>
                    <path fill="#EA4335" d="M12 6.06c1.43 0 2.71.49 3.72 1.45l2.79-2.79C16.84 3.14 14.63 2.18 12 2.18a9.75 9.75 0 0 0-8.7 5.38l3.24 2.53C7.31 7.78 9.46 6.06 12 6.06z"/>
                </svg>
                Continue with Google
            </button>
            
            <!-- Status/Error Message Container -->
            <p id="authStatus" class="mt-4 text-sm font-semibold hidden"></p>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- 2. MAIN APP CONTAINER (Hidden by Default) -->
    <!-- ========================================== -->
    <div id="mainApp" class="hidden flex-col h-screen w-full">
        
        <!-- HEADER -->
        <header class="bg-gray-900 text-white px-6 py-3 flex justify-between items-center z-20 shadow-lg border-b border-gray-800">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-wand-magic-sparkles text-blue-400 text-xl"></i>
                <h1 class="text-2xl font-bold tracking-wide">PosterStudio <span class="text-xs font-light text-gray-400 ml-1">by Bhuvaneshwar</span></h1>
            </div>
            
            <div class="flex items-center gap-4">
                <div class="flex gap-2 bg-gray-800 p-1 rounded-lg">
                    <button onclick="window.switchTab('admin')" id="btnAdmin" class="hidden bg-transparent hover:bg-gray-700 text-gray-300 px-5 py-2 rounded text-sm font-semibold transition-all items-center gap-2">
                        <i class="fa-solid fa-pen-ruler"></i> Editor Mode
                    </button>
                    <button onclick="window.switchTab('shopkeeper')" id="btnShop" class="bg-blue-600 hover:bg-blue-500 text-white px-5 py-2 rounded shadow-sm text-sm font-semibold transition-all flex items-center gap-2">
                        <i class="fa-solid fa-store"></i> Shop Mode
                    </button>
                </div>

                <div class="flex items-center gap-3 ml-2 pl-4 border-l border-gray-700">
                    <img id="userAvatar" src="" alt="Profile" class="w-9 h-9 rounded-full border-2 border-blue-500 object-cover">
                    <button onclick="window.logoutUser()" class="bg-red-500 hover:bg-red-600 text-white px-3 py-1.5 rounded text-xs font-bold transition-colors">
                        Logout
                    </button>
                </div>
            </div>
        </header>

        <!-- ADMIN PANEL (Editor) -->
        <div id="adminPanel" class="flex-1 hidden overflow-hidden">
            <aside class="w-80 bg-white shadow-xl flex flex-col h-full z-10 border-r border-gray-200">
                <div class="p-5 flex-1 overflow-y-auto space-y-6">
                    <div class="bg-gray-50 p-4 rounded-xl border border-gray-100">
                        <label class="font-bold text-gray-700 text-sm mb-3 flex items-center gap-2"><i class="fa-regular fa-image text-blue-500"></i> 1. Background</label>
                        <label class="cursor-pointer bg-white border border-gray-300 hover:border-blue-500 text-gray-700 text-sm text-center py-2 px-4 rounded block shadow-sm">
                            <i class="fa-solid fa-upload mr-1"></i> Upload Image
                            <input type="file" id="bgUpload" accept="image/*" class="hidden">
                        </label>
                    </div>
                    <div>
                        <label class="font-bold text-gray-700 text-sm mb-3 flex items-center gap-2"><i class="fa-solid fa-layer-group text-blue-500"></i> 2. Add Elements</label>
                        <div class="grid grid-cols-2 gap-3">
                            <button onclick="window.addText('{{USER_NAME}}')" class="bg-white border border-gray-200 p-3 text-xs font-semibold rounded-lg hover:border-blue-500 flex flex-col items-center gap-1"><i class="fa-solid fa-user text-lg"></i> User Name</button>
                            <button onclick="window.addText('{{BIZ_NAME}}')" class="bg-white border border-gray-200 p-3 text-xs font-semibold rounded-lg hover:border-blue-500 flex flex-col items-center gap-1"><i class="fa-solid fa-shop text-lg"></i> Biz Name</button>
                            <button onclick="window.addBox('PHOTO')" class="bg-blue-50 border border-blue-200 p-3 text-xs font-semibold rounded-lg text-blue-700 hover:bg-blue-100 flex flex-col items-center gap-1"><i class="fa-solid fa-camera-retro text-lg"></i> Photo Box</button>
                            <button onclick="window.addBox('LOGO')" class="bg-amber-50 border border-amber-200 p-3 text-xs font-semibold rounded-lg text-amber-700 hover:bg-amber-100 flex flex-col items-center gap-1"><i class="fa-solid fa-circle-check text-lg"></i> Logo Box</button>
                        </div>
                    </div>
                    <div id="stylePanel" class="opacity-50 pointer-events-none transition-opacity">
                        <label class="font-bold text-gray-700 text-sm mb-3 flex items-center gap-2"><i class="fa-solid fa-palette text-blue-500"></i> 3. Style Object</label>
                        <div class="bg-white p-4 rounded-xl border border-gray-200 shadow-sm space-y-3">
                            <div class="flex gap-2">
                                <select id="fontFamily" class="w-2/3 border border-gray-300 rounded-md px-2 py-1.5 text-sm outline-none"><option value="sans-serif">Default</option><option value="Roboto">Roboto</option><option value="Poppins">Poppins</option><option value="Oswald">Oswald</option></select>
                                <input type="number" id="fontSize" placeholder="Size" class="w-1/3 border border-gray-300 rounded-md px-2 py-1.5 text-sm outline-none">
                            </div>
                            <div class="flex items-center gap-2">
                                <input type="color" id="colorPicker" class="w-10 h-8 rounded border cursor-pointer">
                                <div class="flex-1 flex bg-gray-100 rounded-md p-1">
                                    <button onclick="window.setTextAlign('left')" class="flex-1 text-gray-600 hover:bg-white rounded py-1 text-sm"><i class="fa-solid fa-align-left"></i></button>
                                    <button onclick="window.setTextAlign('center')" class="flex-1 text-gray-600 hover:bg-white rounded py-1 text-sm"><i class="fa-solid fa-align-center"></i></button>
                                    <button onclick="window.setTextAlign('right')" class="flex-1 text-gray-600 hover:bg-white rounded py-1 text-sm"><i class="fa-solid fa-align-right"></i></button>
                                </div>
                            </div>
                            <button onclick="window.deleteObject()" class="w-full bg-red-50 text-red-600 border border-red-200 py-2 text-sm font-semibold rounded mt-2 flex justify-center items-center gap-2"><i class="fa-solid fa-trash-can"></i> Delete</button>
                        </div>
                    </div>
                </div>
                <div class="p-5 bg-white border-t border-gray-200"><button onclick="window.saveTemplate()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg shadow-md flex justify-center items-center gap-2"><i class="fa-solid fa-floppy-disk"></i> Save Template</button></div>
            </aside>

            <main class="flex-1 bg-slate-200 flex items-center justify-center relative overflow-auto p-8">
                <div class="bg-white shadow-2xl relative border" style="width: 800px; height: 800px; background-image: linear-gradient(45deg, #f0f0f0 25%, transparent 25%), linear-gradient(-45deg, #f0f0f0 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #f0f0f0 75%), linear-gradient(-45deg, transparent 75%, #f0f0f0 75%); background-size: 20px 20px; background-position: 0 0, 0 10px, 10px -10px, -10px 0px;">
                    <canvas id="adminCanvas"></canvas>
                </div>
            </main>
        </div>

        <!-- SHOPKEEPER PANEL (Viewer) -->
        <div id="shopkeeperPanel" class="flex-1 flex flex-col overflow-hidden bg-slate-100">
            <div class="bg-white shadow-md p-4 flex justify-between items-center z-10 border-b">
                <div class="flex items-center gap-4">
                    <div class="w-10 h-10 bg-blue-100 rounded-full flex items-center justify-center text-blue-600"><i class="fa-solid fa-user-tie text-xl"></i></div>
                    <div>
                        <span class="block text-xs text-gray-500 uppercase tracking-wider font-bold">Select Client</span>
                        <select id="userSelect" class="border-none font-bold text-gray-800 bg-transparent text-lg outline-none cursor-pointer" onchange="window.renderShopkeeperPoster()">
                            <option value="0">Ramesh (Hardware)</option>
                            <option value="1">Salman (Mobile Repair)</option>
                            <option value="2">Priya (Boutique)</option>
                        </select>
                    </div>
                </div>
                <button onclick="window.downloadPoster()" class="bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-2.5 px-6 rounded-lg shadow-md flex items-center gap-2"><i class="fa-solid fa-download"></i> Export</button>
            </div>
            <div class="flex-1 flex items-center justify-center p-8 overflow-auto bg-slate-200">
                <div class="bg-white shadow-2xl relative border" style="width: 800px; height: 800px;">
                    <canvas id="shopCanvas"></canvas>
                </div>
            </div>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- JAVASCRIPT LOGIC (Firebase + Fabric) -->
    <!-- ========================================== -->
    <script type="module">
        // 1. Firebase Imports (Added Firestore)
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

        // 2. Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyAkBV0VxVU3Mn0paHqxU0Dgm-TuNRS6hEg",
            authDomain: "posterplus-84021.firebaseapp.com",
            projectId: "posterplus-84021",
            storageBucket: "posterplus-84021.firebasestorage.app",
            messagingSenderId: "556835154127",
            appId: "1:556835154127:web:a5c921e21d83ad8e1cafba",
            measurementId: "G-KJ3C5YVQ0S"
        };
        
        // 3. Initialize Firebase & Firestore
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();
        const db = getFirestore(app);

        let adminCanvas, shopCanvas;
        let savedTemplateJSON = null; // Local Storage Removed!
        let isAdminLoggedIn = false;

        // 🔴 Allowed Admin Email
        const allowedAdminEmails = ["jkhdpix@gmail.com"];

        const dbUsers = [
            { id: 1, name: "Ramesh Kumar", bizName: "Ramesh Hardware & Tools", photo: "https://i.pravatar.cc/300?img=11", logo: "https://ui-avatars.com/api/?name=RH&background=0D8ABC&color=fff&size=200" },
            { id: 2, name: "Salman Khan", bizName: "Salman Mobile Repair", photo: "https://i.pravatar.cc/300?img=12", logo: "https://ui-avatars.com/api/?name=SM&background=FF5733&color=fff&size=200" },
            { id: 3, name: "Priya Sharma", bizName: "Priya Fashion Boutique", photo: "https://i.pravatar.cc/300?img=5", logo: "https://ui-avatars.com/api/?name=PB&background=E83E8C&color=fff&size=200" }
        ];

        adminCanvas = new fabric.Canvas('adminCanvas', { width: 800, height: 800, preserveObjectStacking: true });
        shopCanvas = new fabric.StaticCanvas('shopCanvas', { width: 800, height: 800 });

        // --- AUTHENTICATION STATE LISTENER ---
        onAuthStateChanged(auth, (user) => {
            const loginScreen = document.getElementById('loginScreen');
            const mainApp = document.getElementById('mainApp');
            const userAvatar = document.getElementById('userAvatar');
            const btnAdmin = document.getElementById('btnAdmin');
            const status = document.getElementById("authStatus");
            
            if (user) {
                if (allowedAdminEmails.includes(user.email)) {
                    isAdminLoggedIn = true;
                    loginScreen.classList.add('hidden');
                    mainApp.classList.replace('hidden', 'flex');
                    userAvatar.src = user.photoURL || "https://via.placeholder.com/150";
                    btnAdmin.classList.replace('hidden', 'flex'); 
                    window.switchTab('admin'); 
                } else {
                    isAdminLoggedIn = false;
                    window.logoutUser();
                    
                    loginScreen.classList.remove('hidden');
                    mainApp.classList.replace('flex', 'hidden');
                    status.className = "mt-4 text-sm font-bold text-red-700 block bg-red-100 p-3 rounded-lg border border-red-300 shadow-inner";
                    status.innerHTML = `<i class="fa-solid fa-circle-xmark mr-1"></i> Account Not Found! Access Denied.`;
                }
            } else {
                isAdminLoggedIn = false;
                loginScreen.classList.remove('hidden');
                mainApp.classList.replace('flex', 'hidden');
            }
        });

        // --- LOGIN & LOGOUT FUNCTION ---
        window.loginWithGoogle = async () => {
            const status = document.getElementById("authStatus");
            status.className = "mt-4 text-sm font-semibold text-blue-600 block";
            status.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-1"></i> Connecting to Google...';
            try {
                await signInWithPopup(auth, provider);
            } catch (error) {
                status.className = "mt-4 text-sm font-bold text-red-700 block bg-red-100 p-3 rounded-lg border border-red-300 shadow-inner";
                status.innerHTML = '<i class="fa-solid fa-circle-exclamation mr-1"></i> Login failed or cancelled.';
            }
        };

        window.logoutUser = async () => {
            await signOut(auth);
            document.getElementById("authStatus").classList.add('hidden');
        };

        // --- TAB LOGIC ---
        window.switchTab = (tab) => {
            const adminPnl = document.getElementById('adminPanel');
            const shopPnl = document.getElementById('shopkeeperPanel');
            const btnAdmin = document.getElementById('btnAdmin');
            const btnShop = document.getElementById('btnShop');

            if (tab === 'admin' && isAdminLoggedIn) {
                adminPnl.classList.replace('hidden', 'flex');
                shopPnl.classList.replace('flex', 'hidden');
                btnAdmin.className = "flex bg-blue-600 hover:bg-blue-500 text-white px-5 py-2 rounded shadow-sm text-sm font-semibold transition-all items-center gap-2";
                btnShop.className = "bg-transparent hover:bg-gray-700 text-gray-300 px-5 py-2 rounded text-sm font-semibold transition-all flex items-center gap-2";
            } else if (tab === 'shopkeeper') {
                adminPnl.classList.replace('flex', 'hidden');
                shopPnl.classList.replace('hidden', 'flex');
                btnShop.className = "bg-blue-600 hover:bg-blue-500 text-white px-5 py-2 rounded shadow-sm text-sm font-semibold transition-all flex items-center gap-2";
                if(isAdminLoggedIn) {
                    btnAdmin.className = "flex bg-transparent hover:bg-gray-700 text-gray-300 px-5 py-2 rounded text-sm font-semibold transition-all items-center gap-2";
                }
                // Call fetch & render function automatically
                window.renderShopkeeperPoster();
            }
        };

        // --- FABRIC JS ADMIN EDITOR LOGIC ---
        document.getElementById('bgUpload').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (f) => {
                fabric.Image.fromURL(f.target.result, (img) => {
                    const scale = Math.max(800 / img.width, 800 / img.height);
                    img.set({ scaleX: scale, scaleY: scale, originX: 'center', originY: 'center', top: 400, left: 400 });
                    adminCanvas.setBackgroundImage(img, adminCanvas.renderAll.bind(adminCanvas));
                });
            };
            reader.readAsDataURL(file);
        });

        adminCanvas.on('selection:created', updateStylingPanel);
        adminCanvas.on('selection:updated', updateStylingPanel);
        adminCanvas.on('selection:cleared', () => { document.getElementById('stylePanel').classList.add('opacity-50', 'pointer-events-none'); });

        document.getElementById('colorPicker').oninput = function() { const obj = adminCanvas.getActiveObject(); if(obj) { obj.set('fill', this.value); adminCanvas.renderAll(); }};
        document.getElementById('fontSize').oninput = function() { const obj = adminCanvas.getActiveObject(); if(obj && obj.type === 'i-text') { obj.set('fontSize', parseInt(this.value)); adminCanvas.renderAll(); }};
        document.getElementById('fontFamily').onchange = function() { const obj = adminCanvas.getActiveObject(); if(obj && obj.type === 'i-text') { obj.set('fontFamily', this.value); adminCanvas.renderAll(); }};

        window.addText = (str) => {
            const text = new fabric.IText(str, { left: 400, top: 400, originX: 'center', originY: 'center', fontFamily: 'Poppins', fontSize: 50, fill: '#1e293b', fontWeight: 'bold', placeholderType: 'TEXT', shadow: new fabric.Shadow({ color: 'rgba(255,255,255,0.8)', blur: 2, offsetX: 1, offsetY: 1 }) });
            adminCanvas.add(text); adminCanvas.setActiveObject(text);
        };

        window.addBox = (type) => {
            const isPhoto = type === 'PHOTO';
            const rect = new fabric.Rect({ left: 400, top: 400, originX: 'center', originY: 'center', width: isPhoto ? 250 : 150, height: isPhoto ? 300 : 150, fill: isPhoto ? 'rgba(59, 130, 246, 0.2)' : 'rgba(245, 158, 11, 0.2)', stroke: isPhoto ? '#3b82f6' : '#f59e0b', strokeDashArray: [8,8], strokeWidth: 3, placeholderType: type });
            adminCanvas.add(rect); adminCanvas.setActiveObject(rect);
        };

        window.deleteObject = () => { const obj = adminCanvas.getActiveObject(); if(obj) { adminCanvas.remove(obj); document.getElementById('stylePanel').classList.add('opacity-50', 'pointer-events-none'); } };
        window.setTextAlign = (align) => { const obj = adminCanvas.getActiveObject(); if(obj && obj.type === 'i-text') { obj.set('textAlign', align); adminCanvas.renderAll(); } };

        function updateStylingPanel() {
            const obj = adminCanvas.getActiveObject();
            if(!obj) return;
            const panel = document.getElementById('stylePanel');
            panel.classList.remove('opacity-50', 'pointer-events-none');
            document.getElementById('colorPicker').value = obj.fill || '#000000';
            if(obj.type === 'i-text') {
                document.getElementById('fontSize').value = obj.fontSize;
                document.getElementById('fontFamily').value = obj.fontFamily || 'sans-serif';
            }
        }

        // 👉 CLOUD SAVE LOGIC 👈
        window.saveTemplate = async () => {
            const saveBtn = document.querySelector('button[onclick="window.saveTemplate()"]');
            const originalHTML = saveBtn.innerHTML;
            
            saveBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Saving to Cloud...';
            
            try {
                const json = adminCanvas.toJSON(['placeholderType']);
                savedTemplateJSON = JSON.stringify(json);
                
                // Firestore में डेटा सेव करें
                await setDoc(doc(db, "templates", "main_poster"), {
                    templateData: savedTemplateJSON,
                    updatedAt: new Date().toISOString()
                });
                
                saveBtn.innerHTML = '<i class="fa-solid fa-check"></i> Cloud Saved!';
                saveBtn.classList.replace('bg-blue-600', 'bg-green-600');
                setTimeout(() => {
                    saveBtn.innerHTML = originalHTML;
                    saveBtn.classList.replace('bg-green-600', 'bg-blue-600');
                }, 2000);
            } catch (error) {
                console.error("Cloud Save Error: ", error);
                alert("Error saving to cloud! Check Firestore rules.");
                saveBtn.innerHTML = originalHTML;
            }
        };

        // 👉 CLOUD FETCH & RENDER LOGIC 👈
        window.renderShopkeeperPoster = async () => {
            // अगर टेम्पलेट मेमोरी में नहीं है, तो Firestore से फेच करें
            if (!savedTemplateJSON) {
                try {
                    const docSnap = await getDoc(doc(db, "templates", "main_poster"));
                    if (docSnap.exists()) {
                        savedTemplateJSON = docSnap.data().templateData;
                    } else {
                        console.log("No template found in Cloud.");
                        return;
                    }
                } catch (error) {
                    console.error("Cloud Fetch Error: ", error);
                    alert("Unable to fetch template from cloud.");
                    return;
                }
            }

            const userIndex = document.getElementById('userSelect').value;
            const user = dbUsers[userIndex];

            shopCanvas.loadFromJSON(savedTemplateJSON, () => {
                const objects = shopCanvas.getObjects();
                objects.forEach((obj) => {
                    
                    if (obj.type === 'i-text' || obj.type === 'text') {
                        if (obj.text.includes('{{USER_NAME}}')) {
                            obj.set('text', obj.text.replace('{{USER_NAME}}', user.name));
                        }
                        if (obj.text.includes('{{BIZ_NAME}}')) {
                            obj.set('text', obj.text.replace('{{BIZ_NAME}}', user.bizName));
                        }
                        
                        obj.initDimensions();
                        obj.setCoords();
                    }
                    
                    if (obj.placeholderType === 'PHOTO' || obj.placeholderType === 'LOGO') {
                        const imgUrl = obj.placeholderType === 'PHOTO' ? user.photo : user.logo;
                        fabric.Image.fromURL(imgUrl, (realImg) => {
                            const sX = (obj.width * obj.scaleX) / realImg.width;
                            const sY = (obj.height * obj.scaleY) / realImg.height;
                            realImg.set({ left: obj.left, top: obj.top, originX: obj.originX, originY: obj.originY, scaleX: sX, scaleY: sY, angle: obj.angle });
                            shopCanvas.remove(obj); 
                            shopCanvas.add(realImg); 
                            realImg.moveTo(shopCanvas.getObjects().indexOf(obj));
                            shopCanvas.renderAll();
                        }, { crossOrigin: 'anonymous' });
                    }
                });
                shopCanvas.renderAll();
            });
        };

        window.downloadPoster = () => {
            const dataURL = shopCanvas.toDataURL({ format: 'png', multiplier: 2 });
            const link = document.createElement('a'); link.download = `Poster_${Date.now()}.png`; link.href = dataURL; link.click();
        };
    </script>
</body>
</html>
